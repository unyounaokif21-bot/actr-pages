<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="中川さん">
<link rel="icon" type="image/png" sizes="32x32" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-512.png"><link rel="apple-touch-icon" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-180.png">
<title>中川さん</title>
<style>html,body{margin:0;background:#E9EEF1;font:15px -apple-system,"Hiragino Sans",sans-serif}#msg{padding:24px;line-height:1.7}</style>
</head>
<body>
<div id="msg">中川さんを読み込んでいます…</div>
<!-- 業務ツール（Google Apps Script）の画面を、Googleの帯を出さずにこのページで表示する。
     画面のHTMLはツールから毎回取ってくる（このファイルには中身を書かない）。ツールのURLは「#u=…」で受け取ってこの端末に保存する。
     画面からの google.script.run は、ツールへの POST（doPost の rpc）に置き換える -->
<script>
(function(){
  var h = new URLSearchParams(location.hash.slice(1)), u = h.get('u') || '';
  try { if (u) localStorage.setItem('toolUrl', u); else u = localStorage.getItem('toolUrl') || ''; } catch (e) {}
  var msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)) { msg.textContent = 'このページは、業務ツールの案内リンク（LINEなど）から開いてください。'; return; }
  var qs = new URLSearchParams(location.search); qs.set('raw', '1');
  function shim(EXEC){
    function run(ok, ng){
      return new Proxy({}, { get: function(_, name){
        if (name === 'withSuccessHandler') return function(f){ return run(f, ng); };
        if (name === 'withFailureHandler') return function(f){ return run(ok, f); };
        if (name === 'withUserObject') return function(){ return run(ok, ng); };
        return function(){
          var args = Array.prototype.slice.call(arguments), end = function(){ window.__rpcN = Math.max(0, (window.__rpcN || 0) - 1); };
          // 11/13 社長指示（開くのが重い）：読むだけの呼び出しは、同じ中身が5秒以内に重なったら1回の通信を分け合う
          var RO = /^(前回の入力|前回の話|ボードの履歴|人のまとめ|応募の一覧|番号で探す|求人の全項目|通勤ルート|進捗ステータス|架電キュー|今日外す会社|休み連絡を今日のログから探す|グループ一覧|LINE状態|文字起こしの設定|SMS返信一覧|記録一覧|やり取りの要約|未返信のSMS|求人NG一覧)$/.test(name);
          var key = RO ? name + '|' + JSON.stringify(args) : '', P = window.__rpcP = window.__rpcP || {};
          var p0 = key && P[key] && Date.now() - P[key].t < 5000 ? P[key].p : null;
          if (!p0) {
            window.__rpcN = (window.__rpcN || 0) + 1;      // 画面が「処理中」を出すための数
            p0 = fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: name, args: args }) })
              .then(function(r){ return r.json(); });
            p0.then(end, end);
            if (key) P[key] = { p: p0, t: Date.now() };
          }
          p0.then(function(j){ if (j && j.ok) { if (ok) ok(j.v); } else if (ng) ng(new Error(j && j.e || 'エラー')); })
            .catch(function(e){ if (ng) ng(e); });
        };
      } });
    }
    window.google = { script: { run: run(null, null), host: { close: function(){}, setHeight: function(){} } } };
  }
  // 画面のHTMLと同時に「電話の順番」も取りに行く（画面が出たらすぐ1人目を入れるため）
  function startQP(){ try { window.__QP = fetch(u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: '架電キュー', args: [[]] }) }).then(function(r){ return r.json(); }); window.__QP.catch(function(){}); } catch (e) {} }
  function render(html){
    var head = '<link rel="icon" type="image/png" sizes="32x32" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-512.png"><link rel="apple-touch-icon" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-180.png"><title>中川さん</title><script>(' + shim.toString() + ')(' + JSON.stringify(u) + ');<\/script>';
    document.open(); startQP(); document.write(html.replace(/<head>/i, '<head>' + head)); document.close();   // document.open は通信を止めるので、通信はこのあとで始める
  }
  // 画面のHTMLはこの端末に保存しておいて、すぐ出す。裏で最新を取りに行き、新しくなっていたら保存して、更新の案内を出す
  var saved = '', shown = false;
  try { if (!qs.get('k')) saved = localStorage.getItem('toolHtml') || ''; } catch (e) {}
  // ページを読んでいる途中に書き込むと「読み込んでいます」が残るので、読み終わってから出す
  function latest(){ fetch(u + '?' + qs.toString()).then(function(r){ return r.text(); }).then(function(html){
    if (!/<html/i.test(html)) throw new Error('画面を取得できませんでした');
    if (!qs.get('k') && html !== saved) { try { localStorage.setItem('toolHtml', html); } catch (e) {} }
    if (!shown) { render(html); return; }
    if (html !== saved) {
      // 11/5：小さくて気づけなかったので、画面の一番上に大きく出す（押すと入力を保存して、同じ人の画面のまま新しい版に切り替わる）
      var b = document.createElement('button'); b.textContent = '🔄 業務ツールの新しい版があります。ここを押すと、入力を保存して切り替わります（同じ人のままです）';
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;padding:14px 12px;font-size:16px;font-weight:900;background:#C62828;color:#fff;border:0;box-shadow:0 3px 12px rgba(0,0,0,.3)';
      b.onclick = function(){ try { window.saveNow && window.saveNow(); window.cloudSave && window.cloudSave('自動'); } catch (e) {} b.textContent = '保存して更新しています…'; setTimeout(function(){ location.reload(); }, 1200); }; document.body.appendChild(b);   // 入力中の内容を保存してから読み直す
    }
  }).catch(function(e){ if (!shown) msg.innerHTML = '読み込めませんでした（' + String(e && e.message || e) + '）。<br><a href="' + u + '">こちらから開く</a>'; }); }
  if (/<html/i.test(saved)) { shown = true; setTimeout(function(){ render(saved); latest(); }, 0); }
  else latest();
})();
</script>
</body>
</html>
