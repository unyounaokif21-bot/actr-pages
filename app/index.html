<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="業務ツール">
<link rel="icon" type="image/png" sizes="32x32" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-512.png"><link rel="apple-touch-icon" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-180.png">
<title>業務ツール</title>
<style>html,body{margin:0;background:#E9EEF1;font:15px -apple-system,"Hiragino Sans",sans-serif}#msg{padding:24px;line-height:1.7}</style>
</head>
<body>
<div id="msg">業務ツールを読み込んでいます…</div>
<!-- 業務ツール（Google Apps Script）の画面を、Googleの帯を出さずにこのページで表示する。
     画面のHTMLはツールから毎回取ってくる（このファイルには中身を書かない）。ツールのURLは「#u=…」で受け取ってこの端末に保存する。
     画面からの google.script.run は、ツールへの POST（doPost の rpc）に置き換える -->
<script>
(function(){
  var h = new URLSearchParams(location.hash.slice(1)), u = h.get('u') || '';
  try { if (u) localStorage.setItem('toolUrl', u); else u = localStorage.getItem('toolUrl') || ''; } catch (e) {}
  var msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)) { msg.textContent = 'このページは、業務ツールの案内リンク（LINEなど）から開いてください。'; return; }
  var qs = new URLSearchParams(location.search); qs.set('raw', '1');
  function shim(EXEC){
    function run(ok, ng){
      return new Proxy({}, { get: function(_, name){
        if (name === 'withSuccessHandler') return function(f){ return run(f, ng); };
        if (name === 'withFailureHandler') return function(f){ return run(ok, f); };
        if (name === 'withUserObject') return function(){ return run(ok, ng); };
        return function(){
          var args = Array.prototype.slice.call(arguments);
          fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: name, args: args }) })
            .then(function(r){ return r.json(); })
            .then(function(j){ if (j && j.ok) { if (ok) ok(j.v); } else if (ng) ng(new Error(j && j.e || 'エラー')); })
            .catch(function(e){ if (ng) ng(e); });
        };
      } });
    }
    window.google = { script: { run: run(null, null), host: { close: function(){}, setHeight: function(){} } } };
  }
  // 画面のHTMLと同時に「電話の順番」も取りに行く（画面が出たらすぐ1人目を入れるため）
  try { window.__QP = fetch(u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: '架電キュー', args: [[]] }) }).then(function(r){ return r.json(); }); window.__QP.catch(function(){}); } catch (e) {}
  function render(html){
    var head = '<link rel="icon" type="image/png" sizes="32x32" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-512.png"><link rel="apple-touch-icon" href="https://unyounaokif21-bot.github.io/actr-pages/app/icon-180.png"><title>業務ツール</title><script>(' + shim.toString() + ')(' + JSON.stringify(u) + ');<\/script>';
    document.open(); document.write(html.replace(/<head>/i, '<head>' + head)); document.close();
  }
  // 画面のHTMLはこの端末に保存しておいて、すぐ出す。裏で最新を取りに行き、新しくなっていたら保存して、更新の案内を出す
  var saved = '', shown = false;
  try { if (!qs.get('k')) saved = localStorage.getItem('toolHtml') || ''; } catch (e) {}
  if (/<html/i.test(saved)) { shown = true; render(saved); }
  fetch(u + '?' + qs.toString()).then(function(r){ return r.text(); }).then(function(html){
    if (!/<html/i.test(html)) throw new Error('画面を取得できませんでした');
    if (!qs.get('k') && html !== saved) { try { localStorage.setItem('toolHtml', html); } catch (e) {} }
    if (!shown) { render(html); return; }
    if (html !== saved) {
      var b = document.createElement('button'); b.textContent = '🔄 新しい版があります（押して更新）';
      b.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:9999;padding:8px 12px;font-weight:800;background:#0E6E66;color:#fff;border:0;border-radius:6px';
      b.onclick = function(){ location.reload(); }; document.body.appendChild(b);
    }
  }).catch(function(e){ if (!shown) msg.innerHTML = '読み込めませんでした（' + String(e && e.message || e) + '）。<br><a href="' + u + '">こちらから開く</a>'; });
})();
</script>
</body>
</html>
