<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="業務ツール">
<title>業務ツール</title>
<style>
  html,body{margin:0;height:100%;background:#E9EEF1;font:15px -apple-system,"Hiragino Sans",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #need{display:none;padding:24px;line-height:1.7}
</style>
</head>
<body>
<!-- 業務ツール（Google Apps Script）を全画面で表示する入れ物（Googleの帯を出さないため）。
     ツールのURLはこのファイルに書かず、最初に開くリンクの「#u=…」から受け取ってこの端末に保存する -->
<iframe id="app" allow="microphone; clipboard-read; clipboard-write; autoplay"></iframe>
<div id="need">このページは、業務ツールの案内リンク（LINEなど）から開いてください。</div>
<script>
  var h = new URLSearchParams(location.hash.slice(1)), u = h.get('u') || '';
  try { if (u) localStorage.setItem('toolUrl', u); else u = localStorage.getItem('toolUrl') || ''; } catch (e) {}
  if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)) document.getElementById('app').src = u + location.search;
  else { document.getElementById('app').style.display = 'none'; document.getElementById('need').style.display = 'block'; }
</script>
</body>
</html>
